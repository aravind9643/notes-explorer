name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, rather than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Notes Explorer help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
