name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Packaging runs vscode:prepublish, which bundles src/ into dist/
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: notes-explorer-vsix
          path: '*.vsix'
      # Pushing a tag like v1.1.0 also attaches the .vsix to a GitHub Release
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: '*.vsix'

  # Runs the bundled extension inside a real VS Code (on a virtual display), then drives the
  # Graph, Board and Calendar pages in headless Chrome
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}
      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs (PDF export and webview tests)
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm run test:integration
      - run: npm run test:webview
